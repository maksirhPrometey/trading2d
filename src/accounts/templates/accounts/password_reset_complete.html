{% extends 'base.html' %}
{% load i18n static %}

{% block title %}{% trans 'Пароль змінено' %} – TRADING 2D{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/auth.css' %}">
{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-page__shell container">
    <div class="auth-card">
      <h1 class="auth-card__title">{% trans 'Пароль змінено' %}</h1>
      <p class="auth-card__lead">{% trans 'Тепер можете увійти з новим паролем.' %}</p>
      <p class="auth-card__footer">
        <a href="{% url 'accounts:login' %}">{% trans 'Увійти' %}</a>
      </p>
    </div>
  </div>
</section>
{% endblock %}
