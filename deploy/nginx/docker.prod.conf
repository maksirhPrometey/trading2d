# HTTPS. Перед першим SSL: bash deploy/docker/set-domain.sh trading2d.com
# certbot certonly --standalone -d trading2d.com -d www.trading2d.com

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name trading2d.com www.trading2d.com _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name trading2d.com www.trading2d.com _;
    client_max_body_size 20M;

    ssl_certificate     /etc/letsencrypt/live/trading2d.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading2d.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf;

    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        location ~* \.(php|py|exe|sh)$ {
            deny all;
        }
    }

    location /healthz/ {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        access_log off;
    }

    location / {
        set $upstream http://web:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
