{% load i18n i18n_fields %}
{% if product.primary_image and product.primary_image.image %}
  <img
    class="card-product-image"
    src="{{ product.primary_image.image.url }}"
    alt="{{ product|loc:'name' }}"
    loading="lazy"
    width="600"
    height="600"
  >
{% else %}
  <div class="demo-photo" aria-hidden="true">{% trans 'Фото товару' %}</div>
{% endif %}
